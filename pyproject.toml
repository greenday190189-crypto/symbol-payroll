[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbol-payroll"
version = "0.1.0"
description = "Локальная система расчёта заработной платы сети магазинов «Символ»"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
symbol-payroll = "symbol_payroll.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
