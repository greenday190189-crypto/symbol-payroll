name: Windows application build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build portable application
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc packaging\SymbolPayroll.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Smoke test installed application
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/installer/SymbolPayroll-Setup-0.1.0.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "SymbolPayroll-Smoke"
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }

          $appExe = Join-Path $installDir "SymbolPayroll.exe"
          if (-not (Test-Path $appExe)) { throw "Installed application executable not found" }
          $app = Start-Process -FilePath $appExe -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "Application exited during startup (code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller not found" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }
          if (Test-Path $appExe) { throw "Application files remain after uninstall" }
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: SymbolPayroll-Windows
          path: |
            dist/SymbolPayroll/
            dist/installer/*.exe
          if-no-files-found: error
          retention-days: 30
